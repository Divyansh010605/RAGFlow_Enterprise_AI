services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ragflow_dev_password}
    ports: ["8000:8000"]
    volumes: ["./backend/data:/app/data"]
    depends_on: [redis, qdrant, neo4j]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragflow
      POSTGRES_USER: ragflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragflow_dev_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ragflow_dev_password}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [backend]
  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  grafana_data:
